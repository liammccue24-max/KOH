name: Build Windows executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run electron:build:win
      - uses: actions/upload-artifact@v4
        with:
          name: KOH-Etch-Simulator-windows
          path: release/*.exe
          retention-days: 30
